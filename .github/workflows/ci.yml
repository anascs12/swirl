name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Conversion engines (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg pandoc tesseract-ocr libreoffice-writer libreoffice-draw \
            libegl1 libxkbcommon-x11-0 libxcb-cursor0 fonts-dejavu-core
      - name: Conversion engines (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg pandoc -y --no-progress
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

  build-linux:
    needs: test
    runs-on: ubuntu-22.04   # older glibc, so the .deb runs on Ubuntu 22.04 and newer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . pyinstaller
      - run: packaging/linux/build_deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: swirl-ubuntu
          path: dist/*.deb

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . pyinstaller
      - name: Build app
        working-directory: packaging
        run: pyinstaller --noconfirm --clean --distpath ../dist --workpath ../build swirl.spec
      - name: Smoke test the built app
        shell: bash
        run: |
          python -c "from PIL import Image; Image.new('RGB',(200,100),'red').save('a.pdf')"
          ./dist/swirl/swirl.exe --run compress a.pdf
          test -f "a-compressed.pdf"
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = python -c "import swirl; print(swirl.__version__)"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DVersion=$version" packaging\windows\swirl.iss
      - uses: actions/upload-artifact@v4
        with:
          name: swirl-windows
          path: dist/SwirlSetup-*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
