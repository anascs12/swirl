[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swirl"
version = "0.1.3"
description = "Convert files from a wheel at your cursor. Everything runs locally."
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Anas Khan" }, { name = "Muneeba Saleem" }]
readme = "README.md"
dependencies = [
  "PySide6>=6.6",
  "Pillow>=10.0",
  "pypdf>=6.0",
  "pypdfium2>=4.30",
  "reportlab>=4.0",
  "python-pptx>=1.0",
  "pdfplumber>=0.11",
  "openpyxl>=3.1",
  "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/anascs12/swirl"

[project.scripts]
swirl = "swirl.__main__:main"

[tool.setuptools.packages.find]
include = ["swirl*"]

[tool.setuptools.package-data]
swirl = ["assets/*.png", "assets/*.svg"]

[tool.pytest.ini_options]
filterwarnings = ["error::DeprecationWarning:swirl.*"]
